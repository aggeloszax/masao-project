app:
  name: "Masao Restaurant Chatbot API"
  version: "1.0.0"
  environment: "development"

restaurant:
  slug: "masao"
  display_name: "Masao"

database:
  url: "postgresql+asyncpg://postgres:postgres@localhost:5432/masao"
  pool_size: 10
  max_overflow: 20
  pool_timeout_seconds: 30

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:3001"
    - "https://masao.vercel.app"
  allowed_methods:
    - "GET"
    - "POST"
    - "OPTIONS"

ai:
  # api_key: set ANTHROPIC_API_KEY in .env instead of committing it here.
  model: "claude-opus-4-8"
  max_tokens: 1024
  timeout_seconds: 60.0

chat:
  history_limit: 20
  max_user_message_chars: 1000
  default_table_number: 1

allergy:
  profile_cache_ttl_seconds: 60.0

rate_limit:
  backend: "memory"
  chat_requests: 20
  window_seconds: 60
  max_buckets: 5000
  redis_url:
  redis_key_prefix: "masao"
  redis_socket_timeout_seconds: 1.0
  fail_closed: true
