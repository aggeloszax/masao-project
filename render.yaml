# Render Blueprint — Masao backend (FastAPI) + Redis for production rate limiting.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
services:
  - type: web
    name: masao-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Supabase pooled URL (postgresql+asyncpg://...) — set in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false # set in dashboard, never in git
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://masao.vercel.app — set after the Vercel deploy
      - key: CORS_ALLOWED_METHODS
        value: GET,POST,OPTIONS
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: REDIS_KEY_PREFIX
        value: masao
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "true"
      - key: CHAT_IP_RATE_LIMIT_REQUESTS
        value: "120"
      - key: CHAT_RETENTION_DAYS
        value: "30"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: masao-redis
          property: connectionString

  - type: keyvalue
    name: masao-redis
    plan: free
    ipAllowList: [] # internal connections only
